name: App Android

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Indirizzo dei dati (GitHub Pages di questo repository)
        run: echo "GOCCIA_DATI_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Test e compilazione
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      # I log delle Actions non sono sempre consultabili da fuori: in caso di errore
      # salviamo il riassunto nel ramo ci-log (errori.txt) e come annotazioni.
      - name: Riassunto degli errori
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ci-log
          grep -nE "^e: |^w: .*(deprecated|unused)|error:|What went wrong|FAILED|Execution failed|Caused by|AssertionError|expected:<" build.log | head -500 > /tmp/ci-log/errori.txt || true
          tail -n 300 build.log > /tmp/ci-log/coda.txt
          grep -E "^e: " build.log | head -40 | while IFS= read -r riga; do echo "::error::${riga}"; done || true
          cd /tmp/ci-log
          git init -q -b ci-log
          git add .
          git -c user.name=goccia-ci -c user.email=ci@users.noreply.github.com commit -q -m "Errori della build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log

      - name: Prepara l'APK
        run: cp app/build/outputs/apk/release/app-release.apk goccia.apk

      - uses: actions/upload-artifact@v4
        with:
          name: goccia-apk
          path: app/goccia.apk
          retention-days: 30

      - name: Pubblica l'anteprima
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Versione di prova numero ${GITHUB_RUN_NUMBER}, compilata dal commit ${GITHUB_SHA::7}.
          Per installarla sul telefono scarica goccia.apk da qui sotto e aprila (Android chiede di consentire l'installazione da questa fonte).
          Le versioni successive si installano sopra questa senza perdere i dati."
          if ! gh release view anteprima >/dev/null 2>&1; then
            gh release create anteprima --prerelease --title "Anteprima" --notes "$NOTE"
          fi
          gh release upload anteprima goccia.apk --clobber
          gh release edit anteprima --notes "$NOTE"
