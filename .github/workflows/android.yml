name: App Android

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Indirizzo dei dati (GitHub Pages di questo repository)
        run: echo "GOCCIA_DATI_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      # Numero di versione dell'app. Il repository è stato ricreato dopo 20 build dell'anteprima:
      # la numerazione continua da lì, perché ogni versione nuova si installi sopra la precedente.
      - name: Numero della build
        run: echo "GOCCIA_NUMERO_BUILD=$((GITHUB_RUN_NUMBER + 20))" >> "$GITHUB_ENV"

      # Chiave privata di firma (secret del repository). Senza,
      # l'APK si firma con la chiave di prova dell'anteprima e il bundle per Google Play non si fa.
      - name: Chiave di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.GOCCIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/goccia.jks"
            echo "GOCCIA_KEYSTORE_FILE=$RUNNER_TEMP/goccia.jks" >> "$GITHUB_ENV"
            echo "Firma con la chiave privata del progetto"
          else
            echo "::notice::Nessuna chiave privata nei secret: APK firmato con la chiave di prova, niente bundle per Google Play"
          fi

      - name: Test e compilazione
        id: build
        env:
          GOCCIA_KEYSTORE_PASSWORD: ${{ secrets.GOCCIA_KEYSTORE_PASSWORD }}
          GOCCIA_KEY_ALIAS: ${{ secrets.GOCCIA_KEY_ALIAS }}
          GOCCIA_KEY_PASSWORD: ${{ secrets.GOCCIA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log
          # versione per Google Play: bundle con i caffe in-app e tutte le architetture
          # (Play consegna a ogni telefono solo la sua), solo con la chiave privata
          if [ -n "$GOCCIA_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon bundleRelease -Pgoccia.play -Pgoccia.tutteLeAbi 2>&1 | tee -a build.log
          fi

      # I log delle Actions non sono sempre consultabili da fuori: in caso di errore
      # salviamo il riassunto nel ramo ci-log (errori.txt) e come annotazioni.
      - name: Riassunto degli errori
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ci-log
          grep -nE "^e: |^w: .*(deprecated|unused)|error:|What went wrong|FAILED|Execution failed|Caused by|AssertionError|expected:<" build.log | head -500 > /tmp/ci-log/errori.txt || true
          tail -n 300 build.log > /tmp/ci-log/coda.txt
          grep -E "^e: " build.log | head -40 | while IFS= read -r riga; do echo "::error::${riga}"; done || true
          cd /tmp/ci-log
          git init -q -b ci-log
          git add .
          git -c "user.name=github-actions[bot]" -c "user.email=41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Errori della build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-log

      - name: Prepara l'APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk goccia.apk
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab goccia-play.aab
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: goccia-apk
          path: app/goccia.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: hashFiles('app/goccia-play.aab') != ''
        with:
          name: goccia-play-aab
          path: app/goccia-play.aab
          retention-days: 90

      - name: Pubblica l'anteprima
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTE="Versione di prova numero ${GOCCIA_NUMERO_BUILD}, compilata dal commit ${GITHUB_SHA::7}.
          Per installarla sul telefono scarica goccia.apk da qui sotto e aprila (Android chiede di consentire l'installazione da questa fonte).
          Le versioni successive si installano sopra questa senza perdere i dati."
          if ! gh release view anteprima >/dev/null 2>&1; then
            gh release create anteprima --prerelease --title "Anteprima" --notes "$NOTE"
          fi
          gh release upload anteprima goccia.apk --clobber
          if [ -f goccia-play.aab ]; then
            gh release upload anteprima goccia-play.aab --clobber
            NOTE="$NOTE
          goccia-play.aab è il pacchetto da caricare su Google Play Console (versione ${GOCCIA_NUMERO_BUILD})."
          fi
          gh release edit anteprima --notes "$NOTE"
