name: Prova sull'emulatore

# Installa l'app su un emulatore Android, attraversa le schermate principali e salva
# screenshot, errori e log nel ramo "ci-prova".

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", ".github/workflows/prova.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prova-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Indirizzo dei dati
        run: echo "GOCCIA_DATI_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: APK per l'emulatore (tutte le architetture)
        working-directory: app
        run: ./gradlew --no-daemon assembleRelease -Pgoccia.tutteLeAbi=true

      - name: Accelerazione dell'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e giro delle schermate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/prova-emulatore.sh app/app/build/outputs/apk/release/app-release.apk /tmp/prova

      - name: Pubblica screenshot e log nel ramo ci-prova
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d /tmp/prova ] || exit 0
          cd /tmp/prova
          git init -q -b ci-prova
          git add .
          git -c user.name=goccia-ci -c user.email=ci@users.noreply.github.com commit -q -m "Prova ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-prova
