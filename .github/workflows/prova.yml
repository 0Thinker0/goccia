name: Prova sull'emulatore

# Installa l'app su un emulatore Android, attraversa le schermate principali e salva
# screenshot, errori e log nel ramo "ci-prova".

on:
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", ".github/workflows/prova.yml"]
  workflow_dispatch:
    inputs:
      gpu:
        description: "Rendering grafico dell'emulatore"
        type: choice
        # con swiftshader_indirect MapLibre non disegna segnaposto ed etichette: swangle si
        options: [swangle_indirect, swiftshader_indirect, guest]
        default: swangle_indirect
      giro:
        description: "Tutte le schermate o solo le mappe"
        type: choice
        options: [completo, mappe]
        default: completo

permissions:
  contents: write

concurrency:
  group: prova-${{ github.ref }}-${{ inputs.gpu || 'swangle_indirect' }}-${{ inputs.giro || 'completo' }}
  cancel-in-progress: true

env:
  GPU: ${{ inputs.gpu || 'swangle_indirect' }}
  GIRO: ${{ inputs.giro || 'completo' }}

jobs:
  emulatore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Indirizzo dei dati
        run: echo "GOCCIA_DATI_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: APK per l'emulatore (tutte le architetture)
        working-directory: app
        run: ./gradlew --no-daemon assembleRelease -Pgoccia.tutteLeAbi=true

      - name: Accelerazione dell'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulatore e giro delle schermate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu ${{ env.GPU }} -noaudio -no-boot-anim -camera-back none
          # ogni riga dello script viene eseguita a parte: la scelta del giro sta su una riga sola
          script: if [ "$GIRO" = mappe ]; then bash scripts/prova-mappe.sh app/app/build/outputs/apk/release/app-release.apk /tmp/prova; else bash scripts/prova-emulatore.sh app/app/build/outputs/apk/release/app-release.apk /tmp/prova; fi

      - name: Pubblica screenshot e log nel ramo ci-prova
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d /tmp/prova ] || exit 0
          # il giro di serie va in ci-prova, le varianti in un ramo a parte
          RAMO=ci-prova
          if [ "$GPU" != swangle_indirect ] || [ "$GIRO" != completo ]; then RAMO="ci-prova-$GIRO-$GPU"; fi
          cd /tmp/prova
          git init -q -b "$RAMO"
          git add .
          git -c "user.name=github-actions[bot]" -c "user.email=41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Prova ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}, $GIRO, $GPU)"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RAMO"
