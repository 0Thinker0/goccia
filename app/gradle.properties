org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Indirizzo da cui l'app scarica i prezzi (GitHub Pages del repository).
# Nella build su GitHub Actions viene sostituito dalla variabile GOCCIA_DATI_URL.
goccia.datiUrl=https://0thinker0.github.io/goccia/

# Repository GitHub del progetto (nella build su GitHub viene da GITHUB_REPOSITORY).
goccia.repo=0Thinker0/goccia

# Link per le donazioni (es. https://paypal.me/nome o https://ko-fi.com/nome); vuoto = nessun pulsante
goccia.donazioni=
